<div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
  <div class="login-container card p-4 shadow" style="width:350px;">
    <h1 class="text-center mb-3">Hemodoadores</h1>
    <h4>Teste Técnico</h4>

    <div class="form-group">
      <label>Usuário</label>
      <input [(ngModel)]="username" class="form-control">
    </div>

    <div class="form-group mt-2">
      <label>Senha</label>
      <input [(ngModel)]="password" type="password" class="form-control">
    </div>

    <button class="btn btn-primary w-100 mt-3" (click)="login()">
      Entrar
    </button>

    <div class="alert alert-danger mt-3" *ngIf="erro">
      {{erro}}
    </div>
  </div>
</div>
